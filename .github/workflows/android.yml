name: Android CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar GitHub Release assinada"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Fetch pinned local OCR models
        run: bash scripts/fetch-tessdata.sh
      - name: Privacy static audit
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(android.permission.CAMERA android.permission.RECORD_AUDIO android.permission.READ_EXTERNAL_STORAGE android.permission.WRITE_EXTERNAL_STORAGE android.permission.READ_MEDIA_IMAGES android.permission.READ_MEDIA_VIDEO)
          for permission in "${forbidden[@]}"; do
            if grep -R -q "$permission" app/src/main/AndroidManifest.xml app/src/safe/AndroidManifest.xml; then
              echo "Forbidden permission found: $permission"; exit 1
            fi
          done
          if grep -R -n -E 'FirebaseAnalytics|FirebaseCrashlytics|MediaRecorder' app/src/main/java app/src/safe/java; then
            echo "Forbidden telemetry/recording API found."; exit 1
          fi
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "Full flavor must remain networkless."; exit 1
          fi
          echo "Source privacy audit passed."
      - name: Unit tests, lint and debug builds
        run: gradle --no-daemon testFullDebugUnitTest testSafeDebugUnitTest lintFullDebug lintSafeDebug assembleFullDebug assembleSafeDebug
      - name: Release compilation check
        run: gradle --no-daemon assembleFullRelease assembleSafeRelease
      - name: Audit packaged APK permissions and Safe manifest
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          FULL_DEBUG=app/build/outputs/apk/full/debug/app-full-debug.apk
          SAFE_DEBUG=app/build/outputs/apk/safe/debug/app-safe-debug.apk
          FULL_RELEASE=app/build/outputs/apk/full/release/app-full-release-unsigned.apk
          SAFE_RELEASE=app/build/outputs/apk/safe/release/app-safe-release-unsigned.apk
          forbidden=(android.permission.CAMERA android.permission.RECORD_AUDIO android.permission.READ_EXTERNAL_STORAGE android.permission.WRITE_EXTERNAL_STORAGE android.permission.READ_MEDIA_IMAGES android.permission.READ_MEDIA_VIDEO)
          for apk in "$FULL_DEBUG" "$SAFE_DEBUG" "$FULL_RELEASE" "$SAFE_RELEASE"; do
            test -f "$apk"
            permissions="$($AAPT dump permissions "$apk")"
            for permission in "${forbidden[@]}"; do
              if grep -Fq "$permission" <<< "$permissions"; then
                echo "Forbidden permission in $apk: $permission"; exit 1
              fi
            done
          done
          FULL_PERMS="$($AAPT dump permissions "$FULL_DEBUG")"
          if grep -Fq 'android.permission.INTERNET' <<< "$FULL_PERMS"; then
            echo "Full APK unexpectedly has network permission"; exit 1
          fi
          SAFE_XML="$($AAPT dump xmltree "$SAFE_DEBUG" AndroidManifest.xml)"
          if grep -Fq 'TranslatorAccessibilityService' <<< "$SAFE_XML" || grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' <<< "$SAFE_XML"; then
            echo "Safe APK unexpectedly contains AccessibilityService"; exit 1
          fi
          echo "Safe APK verified: no AccessibilityService; network is limited to ML Kit model downloads."
      - name: Prepare APK artifacts
        run: |
          cp app/build/outputs/apk/full/debug/app-full-debug.apk Translate-de-Cria-v0.1.2-Full-debug.apk
          cp app/build/outputs/apk/safe/debug/app-safe-debug.apk Translate-de-Cria-v0.1.2-Safe-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Translate-de-Cria-v0.1.2-Full-debug
          path: Translate-de-Cria-v0.1.2-Full-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Translate-de-Cria-v0.1.2-Safe-debug
          path: Translate-de-Cria-v0.1.2-Safe-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing not configured yet
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: echo "Skipping signed build until signing secrets are configured."
